[package]
name = "cutile-macro"
description = "cuTile Rust module macro."
version = "0.4.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["Melih Elibol"]
repository = "https://github.com/nvlabs/cutile-rs"
readme = "README.md"
keywords = ["mlir", "cutile", "compiler"]

[lib]
proc-macro = true

[dev-dependencies]
trybuild = "1.0.49"

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits", "visit", "visit-mut", "fold"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1.0.35"
itertools = "0.14.0"
convert_case = "0.8"
cutile-compiler = { git = "https://github.com/NVlabs/cutile-rs.git", branch = "main" }
sha2 = "0.10"
