[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "busy_beaver_blaze._busy_beaver_blaze"
features = ["python"]

[project]
name = "busy-beaver-blaze"
version = "0.2.8"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jupyter>=1.1.1", "gmpy2>=2.2.1", "pillow>=13.0.0", "matplotlib>=3.5.0"]
license = { text = "MIT OR Apache-2.0" }

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "maturin>=1.0,<2.0", "ipykernel", "nbmake>=1.5.0"]

[dependency-groups]
dev = [
    "nbmake>=1.5.5",
    "ruff>=0.8.0",
]

[tool.uv]
# Minimum patched versions for transitive Python dependencies (Dependabot, October 2026).
constraint-dependencies = [
    "anyio>=4.14.2",
    "bleach>=6.4.0",
    "certifi>=2026.10.18",
    "fonttools>=4.60.2",
    "h11>=0.16.0",
    "idna>=3.15",
    "jupyter-core>=5.8.1",
    "jupyter-server>=2.20.0",
    "jupyterlab>=4.5.11",
    "mistune>=3.3.0",
    "nbconvert>=7.17.2",
    "notebook>=7.5.6",
    "pygments>=2.20.0",
    "pytest>=9.0.3",
    "requests>=2.33.0",
    "setuptools>=84.1.0",
    "soupsieve>=2.9.0",
    "tornado>=6.5.9",
    "urllib3>=2.8.0",
]


[tool.pytest.ini_options]
testpaths = ["tests/python", "notebooks"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
# Notebook testing: runs automatically with pytest
# Cells tagged with 'skip-execution' are skipped (see notebooks/conftest.py)
addopts = "--nbmake --nbmake-timeout=10 --ignore=notebooks/rule_set_1_and_2.ipynb"
markers = [
    "notebooks: marks tests as notebook tests (deselect with '-m \"not notebooks\"')",
]
